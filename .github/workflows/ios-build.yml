name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

# Beim Hochladen mehrerer Dateien nicht viele macOS-Runner gleichzeitig anfordern.
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Standard-Intel-macOS-Runner, um Engpässe der ARM64-Runner zu umgehen.
    runs-on: macos-15-intel
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build simulator app
        run: |
          set -o pipefail
          xcodebuild -project SamsungRemotePlus.xcodeproj -scheme SamsungRemotePlus -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          xcodebuild -project SamsungRemotePlus.xcodeproj -scheme SamsungRemotePlus -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/remote-build" CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/remote-build/Build/Products/Release-iphoneos/SamsungRemotePlus.app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qr "$GITHUB_WORKSPACE/SamsungRemotePlus-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SamsungRemotePlus-unsigned-ipa
          path: SamsungRemotePlus-unsigned.ipa
          if-no-files-found: error
